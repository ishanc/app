services:
  file-server:
    build: .
    image: file-server-app
    container_name: app-file-server
    ports:
      - "8000:8000"
    volumes:
      - ./file_server/uploads:/app/file_server/uploads
      - ./file_server/processed:/app/file_server/processed
      - ./file_server/downloads:/app/file_server/downloads
    environment:
      - FLASK_APP=file_server/app.py
      - FLASK_ENV=production
      - PYTHONPATH=/app
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
