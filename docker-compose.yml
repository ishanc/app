version: '3.8'

services:
  app:
    build: 
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    volumes:
      - ./file_server/uploads:/app/file_server/uploads
      - ./file_server/processed:/app/file_server/processed
      - ./file_server/logs:/app/file_server/logs
      - ./logs:/app/logs
    environment:
      - NEO4J_URI=bolt://54.158.241.161:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=test1234
      - NEO4J_DATABASE=neo4j
      - FLASK_ENV=production
      - PYTHONPATH=/app
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/"]
      interval: 30s
      timeout: 3s
      retries: 3
    init: true
