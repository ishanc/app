<?xml version="1.0" encoding="UTF-8"?>
<svg width="120" height="40" viewBox="0 0 120 40" xmlns="http://www.w3.org/2000/svg">
    <!-- Neural Network nodes and connections -->
    <g fill="#3b82f6" stroke="#2563eb">
        <!-- Input Layer -->
        <circle cx="20" cy="10" r="4"/>
        <circle cx="20" cy="20" r="4"/>
        <circle cx="20" cy="30" r="4"/>
        
        <!-- Hidden Layer -->
        <circle cx="50" cy="15" r="4"/>
        <circle cx="50" cy="25" r="4"/>
        
        <!-- Output Layer -->
        <circle cx="80" cy="20" r="4"/>
        
        <!-- Connections -->
        <line x1="24" y1="10" x2="46" y2="15" stroke-width="1"/>
        <line x1="24" y1="20" x2="46" y2="15" stroke-width="1"/>
        <line x1="24" y1="20" x2="46" y2="25" stroke-width="1"/>
        <line x1="24" y1="30" x2="46" y2="25" stroke-width="1"/>
        <line x1="54" y1="15" x2="76" y2="20" stroke-width="1"/>
        <line x1="54" y1="25" x2="76" y2="20" stroke-width="1"/>
    </g>
    
    <!-- Text -->
    <text x="90" y="25" font-family="Arial" font-size="12" font-weight="bold" fill="#3b82f6">LMS</text>
</svg>