<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SumTotal to CSOD LMS- DM Tool (Powered by IERPA LLC)</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <h1>SumTotal to CSOD LMS- DM Tool</h1> 
        <p class="powered-by">(Powered by IERPA LLC)</p>
        
        <div class="upload-section">
            <div class="upload-box" id="drop-zone">
                <input type="file" id="file-input" class="file-input" multiple />
                <label for="file-input">
                    <div class="upload-content">
                        <img src="{{ url_for('static', filename='upload-icon.svg') }}" alt="Upload" class="upload-icon">
                        <p>Drag & drop files here or click to browse</p>
                        <p class="upload-hint">(You can select multiple files)</p>
                    </div>
                </label>
            </div>
            <div id="upload-queue"></div>
            <div class="progress-bar" id="progress-bar">
                <div class="progress" id="progress"></div>
            </div>
        </div>

        <div class="files-section">
            <div class="section-header">
                <h2>Quality Reports (PDF)</h2>
                <div class="action-buttons">
                    <button id="generatePDFBtn" class="btn btn-primary">Generate PDF Report</button>
                    <button id="resetAllBtn" class="btn btn-danger">Reset All Data</button>
                </div>
            </div>
            <div class="files-list" id="pdf-files-list">
                <!-- PDF files will be listed here -->
            </div>
            
            <h2>Processed Data Files</h2>
            <div class="files-list" id="files-list">
                <!-- Files will be listed here -->
            </div>
            
            <h2>Anomaly Reports</h2>
            <div class="files-list" id="anomaly-files-list">
                <!-- Anomaly reports will be listed here -->
            </div>
            
            <div class="delete-message" id="delete-message"></div>
        </div>
    </div>
    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
